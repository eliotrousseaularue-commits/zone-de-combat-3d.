<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111e"><link rel="manifest" href="/manifest.webmanifest"><title>Tir.gun</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head>
<body><div id="scene"></div><div class="shade"></div>
<section id="menu" class="screen"><div class="brand">TIR<span>.</span>GUN</div><div class="tag">OPÉRATION SURVIE · 3D</div><h1>CHOISIS TON<br><em>CHAMP DE BATAILLE</em></h1><div class="maps">
<button class="map selected" data-map="city"><b>01</b><strong>VILLE FANTÔME</strong><small>Rues abandonnées · crépuscule</small></button>
<button class="map" data-map="desert"><b>02</b><strong>DÉSERT ROUGE</strong><small>Dunes · base militaire</small></button>
<button class="map" data-map="forest"><b>03</b><strong>FORÊT NOIRE</strong><small>Brume · avant-poste</small></button></div>
<div class="loadout"><span>ARSENAL</span><strong>FUSIL D’ASSAUT</strong><small>Équipement de départ</small></div>
<button id="start" class="primary">LANCER LA MISSION <span>▶</span></button><p class="foot">MODE SOLO · ENNEMIS IA · SURVIE</p></section>
<div id="hud" class="hidden"><div class="top"><b>TIR.GUN</b><span id="mapName">VILLE FANTÔME</span><span id="score">ÉLIMINATIONS 0</span><button id="pause">Ⅱ</button></div><div class="cross">+</div><div class="bottom"><div class="stats"><b id="health">♥ 100</b><b id="ammo">30 / ∞</b></div><div class="pad"><button id="up">▲</button><div><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div></div><button id="fire">TIR</button></div></div>
<div id="pauseBox" class="hidden"><h2>MISSION EN PAUSE</h2><button id="resume" class="primary">REPRENDRE</button><button id="home">MENU PRINCIPAL</button></div>
<script>
(function(){
 const status=document.createElement("div");
 status.id="loadError";
 status.style.cssText="display:none;position:fixed;z-index:9999;inset:0;background:#07111e;color:white;padding:28px;font:16px Arial;text-align:center";
 status.innerHTML="<h2>Tir.gun</h2><p>Le moteur 3D n’a pas pu se charger.</p><button onclick='location.reload()' style='padding:14px 22px;border:0;border-radius:8px;background:#ff653b;color:white;font-weight:bold'>RÉESSAYER</button>";
 document.body.appendChild(status);
 function load(url,failed){
  const s=document.createElement("script");s.src=url;s.onload=()=>{if(window.THREE){const g=document.createElement("script");g.src="/game.js?v=4";document.body.appendChild(g)}else failed()};
  s.onerror=failed;document.body.appendChild(s);
 }
 function trySources(urls){
  if(!urls.length){status.style.display="block";return}
  load(urls[0],()=>trySources(urls.slice(1)));
 }
 trySources([
  "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js",
  "https://unpkg.com/three@0.160.0/build/three.min.js"
 ]);
 document.querySelectorAll(".map").forEach(button=>{
  button.addEventListener("pointerup",()=>{
   document.querySelectorAll(".map").forEach(item=>item.classList.remove("selected"));
   button.classList.add("selected");
  });
 });
 if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
})();
</script></body></html>
